# Weather bot settings. Everything here runs on paper unless you pass --live.

venues: [us, intl]            # us = Polymarket US, intl = polymarket.com
db_path: data/weatherbot.sqlite
report_dir: reports
bankroll_usd: 1000            # starting paper bankroll, per venue
max_lead_days: 2              # price today plus this many days ahead
max_obs_age_hours: 3          # skip today's markets if the station has gone quiet
order_ttl_minutes: 30         # a resting limit order lives this long before fallback

strategy:
  edge_threshold: 0.05        # model probability - best ask - fee
  kelly_fraction: 0.15        # must stay within 0.10-0.25
  min_price: 0.02
  max_price: 0.98
  max_trade_usd: 25
  max_day_usd: 100
  max_event_usd: 40           # buckets in one event are correlated
  max_depth_share: 0.15       # share of visible depth at prices that still have edge
  execution: maker_first      # maker_first | taker

model:
  spread_inflation: 1.3       # ensembles are underdispersed
  kernel_sigma_start_c: 0.7   # smoothing per member, before observations count
  kernel_sigma_end_c: 0.25    # and once they dominate
  obs_start_hour: 6           # local hour observations start to count
  obs_full_hour: 17           # local hour they fully count
  anchor_tau_hours: 6         # how fast a member's current error decays
  edge_shift_c: 0.25          # shift used to find probabilities that hinge on a bucket edge
  prob_epsilon: 0.01          # shrink toward uniform so nothing is ever certain
  min_horizon_coverage: 0.75
  # NWS days only: chance the sensor peaked 0, 1, 2, 3, 4F above the highest report.
  # Measured over 112 station-days in October 2026.
  sensor_gap_f: [0.46, 0.41, 0.08, 0.03, 0.02]

forecast:
  models: [gfs025, ecmwf_ifs025]
  max_age_hours: 18           # how long a run may be reused if a refresh fails
  past_days: 1
  forecast_days: 5

bias:
  window_days: 30
  shrink_days: 3              # correction weight is n / (n + shrink_days)
  min_days: 7                 # no trades at a station until each model has this many settled days

live:
  # Set this to true only after you have confirmed in the Polymarket US app
  # that your account can trade temperature markets from Illinois.
  jurisdiction_confirmed: false
  bankroll_usd: 100
  daily_loss_limit_usd: 20
  max_order_usd: 10
  max_day_usd: 25
  kill_file: data/KILL

